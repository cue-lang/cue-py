[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["cue*", "libcue*"]

[tool.setuptools.package-data]
cue = ["py.typed"]
libcue = ["libcue.dylib", "libcue.so", "cue.dll", "py.typed"]

[project]
name = "cue-py"
version = "0.1.0"
dependencies = [
    "attrs>=23.2.0",
    "cffi>=2.1.1",
    "filelock>=3.13.4",
    "iniconfig>=2.0.0",
    "pluggy>=1.4.0",
    "pycparser>=2.22",
]

[dependency-groups]
dev = [
    "mypy>=1.9.0",
    "mypy-extensions>=1.0.0",
    "pytest>=8.1.1",
    "pytest-mypy>=0.10.3",
    "types-cffi>=2.1.0.20260827",
    "types-setuptools>=69.5.0.20240423",
    "typing_extensions>=4.11.0",
]
